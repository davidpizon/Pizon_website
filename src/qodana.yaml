# Qodana settings for the .NET solution (used by .github/workflows/qodana.yml; see docs/deploy.md).
version: "1.0"
# The container may not ship the .NET SDK that global.json pins: install it next to the image's own SDK.
bootstrap: >-
  curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh &&
  bash /tmp/dotnet-install.sh --jsonfile global.json --install-dir "$(dirname "$(readlink -f "$(command -v dotnet)")")"
profile:
  name: qodana.recommended
dotnet:
  solution: Pizon.slnx
exclude:
  - name: All
    paths:
      - Pizon.Web/Data/Migrations
      - templates
      - tests/js
